name: Rust Core Regression
on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-core.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/neuroscape-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust source in CI workspace
        run: cargo fmt --all
      - name: Verify formatted workspace
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --all-targets --locked
      - name: Rust clippy
        run: cargo clippy --all-targets --locked -- -D warnings
