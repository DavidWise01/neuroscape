name: Rust Core Regression
on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-core.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/neuroscape-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format Rust source in CI workspace
        run: cargo fmt --all
      - name: Verify formatted workspace
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --all-targets --locked
      - name: Rust clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Compile browser WebAssembly
        run: cargo build --target wasm32-unknown-unknown --release --locked
      - name: Verify generated browser asset
        working-directory: .
        run: python3 rust/build-wasm.py
      - name: Print compiled browser binary for source pinning
        working-directory: .
        run: cat assets/neuroscape-rust-wasm.generated.js
