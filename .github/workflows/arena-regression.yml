name: Arena non-regression (Chromium)
on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/baseline-lock.mjs
      - tests/arena-regression.mjs
      - tests/recovery-evidence-gate.mjs
      - docs/RECOVERY-BASELINE-v2.9.00.md
      - .github/workflows/arena-regression.yml
  workflow_dispatch:
jobs:
  arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch immutable arena baseline
        run: git fetch --no-tags origin baseline/v2.8.57-locked-arena:refs/remotes/origin/baseline/v2.8.57-locked-arena
      - name: Enforce append-only playfield baseline
        run: node tests/baseline-lock.mjs
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify visible 5x2 arena and real game startup
        run: node tests/arena-regression.mjs
      - name: Enforce frozen recovery acceptance evidence
        run: node tests/recovery-evidence-gate.mjs
      - name: Upload recovery acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-baseline-v2.9.00
          path: recovery-baseline.json
          if-no-files-found: ignore
      - name: Upload arena screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-browser-proof
          path: arena-regression.png
          if-no-files-found: ignore
