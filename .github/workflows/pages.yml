name: Deploy Ether Arena
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  cross-environment:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          targets: wasm32-unknown-unknown
      - name: RUST-017 compile pinned Ubuntu 22.04 witness
        run: cargo build --manifest-path rust/neuroscape-core/Cargo.toml --release --locked --target wasm32-unknown-unknown
      - name: RUST-017 record exact-commit witness fingerprint
        run: python3 rust/tests/reproduce_cross_runner.py emit
      - uses: actions/upload-artifact@v4
        with:
          name: rust017-witness-${{ github.run_id }}
          path: rust/tests/.rust017-cross-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  deploy:
    needs: cross-environment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: RUST-023 emergency publication freeze switch
        env:
          RUST023_EMERGENCY_FREEZE: ${{ vars.RUST023_EMERGENCY_FREEZE }}
        run: |
          case "${RUST023_EMERGENCY_FREEZE,,}" in
            1|true|yes|on)
              echo "::error::RUST-023 emergency freeze: new Pages publication denied"
              exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Normalize Rust formatting in CI workspace
        run: cargo fmt --manifest-path rust/neuroscape-core/Cargo.toml --all
      - name: Verify Rust format, tests, and lint
        run: |
          cargo fmt --manifest-path rust/neuroscape-core/Cargo.toml --all -- --check
          cargo test --manifest-path rust/neuroscape-core/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path rust/neuroscape-core/Cargo.toml --all-targets --locked -- -D warnings
      - name: Compile fresh Rust WASM for GitHub Pages
        run: cargo build --manifest-path rust/neuroscape-core/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - name: Embed SHA-256 labeled compiled WASM
        run: python3 rust/build-wasm.py
      - name: Install Chromium browser verification
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Require phase and combat replay parity before publication
        run: python3 rust/tests/run_rust009_browser.py
      - name: RUST-016 reproduce exact-commit WASM in isolated Cargo build
        run: python3 rust/tests/reproduce_wasm.py
      - uses: actions/download-artifact@v4
        with:
          name: rust017-witness-${{ github.run_id }}
          path: rust/tests
      - name: RUST-017 compare exact WASM across pinned runner environments
        run: python3 rust/tests/reproduce_cross_runner.py compare
      - name: RUST-013 write verified deployment manifest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          asset = Path("assets/neuroscape-rust-wasm.generated.js")
          source = asset.read_text(encoding="utf-8")
          match = re.search(r"NEUROSCAPE_RUST_WASM_BASE64\s*=\s*['\"]([^'\"]+)['\"]", source)
          if not match:
              raise SystemExit("WASM content missing from generated browser asset")
          blob = base64.b64decode(match.group(1), validate=True)
          if blob[:4] != b"\x00asm":
              raise SystemExit("invalid WebAssembly magic")
          digest = hashlib.sha256(blob).hexdigest()
          advertised = re.search(r"NEUROSCAPE_RUST_WASM_SHA256\s*=\s*['\"]([a-f0-9]{64})['\"]", source)
          if not advertised or advertised.group(1) != digest:
              raise SystemExit("WASM digest mismatch: release blocked")
          replay_receipt = Path("rust/tests/.rust015-local-evidence.json")
          if not replay_receipt.is_file():
              raise SystemExit("RUST-015 missing predeployment browser replay receipt")
          replay = json.loads(replay_receipt.read_text(encoding="utf-8"))
          if replay.get("source_commit") != os.environ["SOURCE_COMMIT"] or replay.get("replay_steps") != 3:
              raise SystemExit("RUST-015 invalid replay receipt ancestry")
          if not re.fullmatch(r"[0-9a-f]{64}", replay.get("replay_sha256", "")):
              raise SystemExit("RUST-015 invalid replay SHA-256")
          reproduction_path = Path("assets/rust016-reproduction.json")
          if not reproduction_path.is_file():
              raise SystemExit("RUST-016 reproducibility receipt missing")
          reproduction = json.loads(reproduction_path.read_text(encoding="utf-8"))
          if reproduction.get("source_commit") != os.environ["SOURCE_COMMIT"] or not reproduction.get("reproducible"):
              raise SystemExit("RUST-016 reproduction source/authority mismatch")
          if reproduction.get("primary_wasm_sha256") != digest or reproduction.get("isolated_wasm_sha256") != digest:
              raise SystemExit("RUST-016 source-build fingerprint mismatch")
          cross = json.loads(Path("assets/rust017-cross-environment.json").read_text(encoding="utf-8"))
          if (cross.get("source_commit") != os.environ["SOURCE_COMMIT"]
                  or cross.get("wasm_sha256") != digest
                  or cross.get("cross_runner_match") is not True
                  or cross.get("independent_source_witness") is not False):
              raise SystemExit("RUST-017 cross-environment receipt mismatch")
          report = {
              "cross_runner_reproducible": True,
              "cross_runner_wasm_sha256": cross["wasm_sha256"],
              "reproduction_wasm_sha256": reproduction["isolated_wasm_sha256"],
              "reproducible_build": True,
              "replay_sha256": replay["replay_sha256"],
              "replay_steps": replay["replay_steps"],
              "phase": "RUST-013",
              "source_commit": os.environ["SOURCE_COMMIT"],
              "github_run_id": os.environ["RUN_ID"],
              "wasm_sha256": digest,
              "wasm_bytes": len(blob),
              "native_rust_gate": "passed_in_deployment_job",
              "chromium_phase_and_combat_gate": "passed_in_deployment_job",
              "release_scope": "copied_state_observation_only",
              "live_gameplay_authority": False,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "notice": "Build-time checks, not independent external custody or live gameplay authorization."
          }
          target = Path("assets/rust013-release.json")
          target.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("RUST-013 manifest:", target, "WASM SHA-256:", digest)
          PY
      - name: RUST-023 test compromised-key revocation and emergency freeze
        run: python3 -m unittest discover -s rust/tests -p 'test_revocation_rust023.py' -v
      - name: RUST-024 test quarantine and highwater rollback invariants
        run: python3 -m unittest discover -s rust/tests -p 'test_recovery_epoch_rust024.py' -v
      - name: RUST-025 verify highwater witness and anti-fork negative tests
