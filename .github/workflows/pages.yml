name: Deploy Ether Arena
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Normalize Rust formatting in CI workspace
        run: cargo fmt --manifest-path rust/neuroscape-core/Cargo.toml --all
      - name: Verify Rust format, tests, and lint
        run: |
          cargo fmt --manifest-path rust/neuroscape-core/Cargo.toml --all -- --check
          cargo test --manifest-path rust/neuroscape-core/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path rust/neuroscape-core/Cargo.toml --all-targets --locked -- -D warnings
      - name: Compile fresh Rust WASM for GitHub Pages
        run: cargo build --manifest-path rust/neuroscape-core/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - name: Embed SHA-256 labeled compiled WASM
        run: python3 rust/build-wasm.py
      - name: Install Chromium browser verification
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Require phase and combat replay parity before publication
        run: python3 rust/tests/run_rust009_browser.py
      - name: RUST-013 write verified deployment manifest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          asset = Path("assets/neuroscape-rust-wasm.generated.js")
          source = asset.read_text(encoding="utf-8")
          match = re.search(r"NEUROSCAPE_RUST_WASM_BASE64\s*=\s*['\"]([^'\"]+)['\"]", source)
          if not match:
              raise SystemExit("WASM content missing from generated browser asset")
          blob = base64.b64decode(match.group(1), validate=True)
          if blob[:4] != b"\x00asm":
              raise SystemExit("invalid WebAssembly magic")
          digest = hashlib.sha256(blob).hexdigest()
          advertised = re.search(r"NEUROSCAPE_RUST_WASM_SHA256\s*=\s*['\"]([a-f0-9]{64})['\"]", source)
          if not advertised or advertised.group(1) != digest:
              raise SystemExit("WASM digest mismatch: release blocked")
          replay_receipt = Path("rust/tests/.rust015-local-evidence.json")
          if not replay_receipt.is_file():
              raise SystemExit("RUST-015 missing predeployment browser replay receipt")
          replay = json.loads(replay_receipt.read_text(encoding="utf-8"))
          if replay.get("source_commit") != os.environ["SOURCE_COMMIT"] or replay.get("replay_steps") != 3:
              raise SystemExit("RUST-015 invalid replay receipt ancestry")
          if not re.fullmatch(r"[0-9a-f]{64}", replay.get("replay_sha256", "")):
              raise SystemExit("RUST-015 invalid replay SHA-256")
          report = {
              "replay_sha256": replay["replay_sha256"],
              "replay_steps": replay["replay_steps"],
              "phase": "RUST-013",
              "source_commit": os.environ["SOURCE_COMMIT"],
              "github_run_id": os.environ["RUN_ID"],
              "wasm_sha256": digest,
              "wasm_bytes": len(blob),
              "native_rust_gate": "passed_in_deployment_job",
              "chromium_phase_and_combat_gate": "passed_in_deployment_job",
              "release_scope": "copied_state_observation_only",
              "live_gameplay_authority": False,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "notice": "Build-time checks, not independent external custody or live gameplay authorization."
          }
          target = Path("assets/rust013-release.json")
          target.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("RUST-013 manifest:", target, "WASM SHA-256:", digest)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: RUST-014 verify deployed Pages manifest and public combat witness
        env:
          RUST014_PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: python3 rust/tests/verify_live_pages.py
